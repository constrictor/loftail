name: build-test-package

# Builds, tests, and packages loftail on all three target platforms.
#
# This workflow is the vehicle for the cross-platform verification that cannot
# happen on the Linux dev machine: it produces the Windows and macOS artifacts
# and smoke-tests them, and doubles as the "verify the build on Windows and
# macOS" check that PLAN.md M0 left open.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Ubuntu 24.04 is the reference build environment (ARCHITECTURE.md §1):
    # stock GCC 13 + CMake + Ninja + Qt 6.4.2 from the system repos, no
    # separately-installed Qt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain + system Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            qt6-base-dev libgl1-mesa-dev \
            libssh2-1-dev libarchive-dev \
            libfuse2 file desktop-file-utils

      - name: Configure + build (Debug) and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee configure.log
          # SSH support is AUTO-detected, so a missing libssh2 would quietly disable
          # remote logs and the job would still go green. It is installed above, so
          # "not found" here means the dependency broke — fail loudly.
          grep -q "SSH remote sources: ENABLED" configure.log \
            || { echo "::error::libssh2 was not detected; remote log support is off"; exit 1; }
          # Same for libarchive: auto-detection failing silently would drop the archive
          # tests from the run entirely, so the suite would shrink and still go green.
          grep -q "Archived log sources: ENABLED" configure.log \
            || { echo "::error::libarchive was not detected; archived log support is off"; exit 1; }
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      # The no-SSH configuration is a supported build, not a theoretical one
      # (ARCHITECTURE.md §1: the reference build installs nothing extra). Prove it
      # still builds and that its whole test suite passes.
      - name: Configure + build + test without SSH
        run: |
          cmake -S . -B build-nossh -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOFTAIL_WITH_SSH=OFF
          cmake --build build-nossh
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-nossh --output-on-failure

      # Likewise for archives, and both off together — which is the actual reference
      # build (ARCHITECTURE.md §1: stock Ubuntu toolchain, nothing separately
      # installed). The ungated tests must pass here too: tst_archivelocation and
      # tst_complete cover the path layer and the completion contract precisely
      # because those must behave the same with and without the dependency.
      - name: Configure + build + test with neither optional dependency
        run: |
          cmake -S . -B build-bare -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DLOFTAIL_WITH_SSH=OFF -DLOFTAIL_WITH_ARCHIVE=OFF 2>&1 | tee configure-bare.log
          grep -q "Archived log sources: DISABLED" configure-bare.log \
            || { echo "::error::-DLOFTAIL_WITH_ARCHIVE=OFF did not disable archives"; exit 1; }
          cmake --build build-bare
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-bare --output-on-failure

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh Release

      - name: Smoke-test the AppImage (no dev Qt env)
        env:
          # CI runners are headless (no X display); the AppImage bundles the
          # offscreen QPA plugin so QApplication can start without one.
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMG=$(ls dist/loftail-*-x86_64.AppImage | head -n1)
          chmod +x "$APPIMG"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMG" --version
          # linuxdeploy resolves dependencies through ldd, so libssh2 (and the crypto
          # it pulls in) should have been bundled. Verify rather than assume: a
          # --version smoke test does not open a remote log, so a missing library
          # would only surface for a user, on the first ssh:// open.
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMG" --appimage-extract >/dev/null
          for lib in libssh2 libarchive; do
            if ! ls squashfs-root/usr/lib/$lib.so* >/dev/null 2>&1; then
              echo "::error::$lib was not bundled into the AppImage"
              exit 1
            fi
          done
          ls -l squashfs-root/usr/lib/libssh2.so* squashfs-root/usr/lib/libarchive.so*
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v7
        with:
          name: loftail-linux-appimage
          path: dist/*.AppImage

  deb:
    # Ubuntu packages, one per release. NOT one package built once: 24.04 has
    # Qt 6.4.2 and 26.04 a much newer Qt with different sonames, so a single .deb
    # cannot satisfy both. The release is stamped into the version
    # (0.1.0~ubuntu24.04) by packaging/linux/deb.cmake, from /etc/os-release.
    #
    # This is the opposite artifact to the AppImage above and deliberately
    # duplicates its build: the AppImage bundles Qt so it runs anywhere, the .deb
    # links the distro's Qt so it stays small and gets archive security updates.
    # The AppImage step asserts the optional libraries are INSIDE the artifact;
    # here the same guarantee is an assertion that they are in Depends.
    #
    # 26.04 is a second thing at once: the reference Qt floor is 6.4 (ARCHITECTURE.md
    # §1) and nothing so far proves the CEILING — this is the only job that compiles
    # loftail with a much newer Qt and GCC.
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.04"
            experimental: false
          # ubuntu-26.04 is a PUBLIC PREVIEW runner image (announced 2026-06-11):
          # usable by everyone, but with longer queues at peak and tool versions
          # that still move. Non-blocking until it has run green a few times —
          # flip `experimental` to false then, and this becomes a required check.
          - release: "26.04"
            experimental: true
    runs-on: ubuntu-${{ matrix.release }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain + system Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            qt6-base-dev libgl1-mesa-dev \
            libssh2-1-dev libarchive-dev \
            file desktop-file-utils

      - name: Configure + build (Release) and test
        run: |
          cmake -S . -B build-deb -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure-deb.log
          # Both are auto-detected and both were just installed, so DISABLED here means
          # the setup broke — and it would go on to produce a package that silently
          # lacks the feature, since shlibdeps only reports what was actually linked.
          for want in "SSH remote sources: ENABLED" "Archived log sources: ENABLED"; do
            grep -q "$want" configure-deb.log \
              || { echo "::error::the packaged build reported '$want' missing"; exit 1; }
          done
          cmake --build build-deb
          # Run the suite against THIS toolchain, not just the Debug job's. On 26.04
          # that is the point of the job as much as the package is.
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-deb --output-on-failure

      - name: Build .deb
        working-directory: build-deb
        run: cpack -G DEB

      - name: Verify the package metadata
        run: |
          DEB=$(ls build-deb/loftail_*.deb | head -n1)
          echo "package: $DEB"
          dpkg -I "$DEB"
          dpkg -c "$DEB"

          # The version must name the release it was built for, or the two releases'
          # packages collide on a release page and upgrade over each other.
          case "$DEB" in
            *"~ubuntu${{ matrix.release }}_"*) ;;
            *) echo "::error::$DEB is not stamped ~ubuntu${{ matrix.release }}"; exit 1 ;;
          esac

          # A .deb bundles nothing, so "the optional libraries are present" means they
          # are in Depends. dpkg-shlibdeps writes a thin, valid-looking Depends just as
          # happily when a library was auto-detected off.
          DEPENDS=$(dpkg -f "$DEB" Depends)
          for lib in libqt6 libssh2 libarchive; do
            echo "$DEPENDS" | grep -q "$lib" \
              || { echo "::error::Depends does not mention $lib: $DEPENDS"; exit 1; }
          done

          # And nothing of Qt may be INSIDE it — that is the AppImage's job. A stray
          # bundled libQt6*.so would ship an unmanaged, unpatched Qt to users.
          if dpkg -c "$DEB" | grep -q "libQt6"; then
            echo "::error::the .deb bundles Qt libraries; it must link the distro's"
            exit 1
          fi

      - name: Install it and run it
        run: |
          DEB=$(ls build-deb/loftail_*.deb | head -n1)
          # apt, not dpkg -i: it RESOLVES Depends, so a dependency that does not exist
          # in this release's archive fails here rather than on a user's machine.
          sudo apt-get install -y "./$DEB"
          command -v loftail
          QT_QPA_PLATFORM=offscreen loftail --version
          # The .desktop file is what makes the soft file association work once
          # installed (packaging/README.md); a malformed one installs silently.
          desktop-file-validate /usr/share/applications/loftail.desktop
          sudo apt-get remove -y loftail

      - uses: actions/upload-artifact@v7
        with:
          name: loftail-deb-ubuntu-${{ matrix.release }}
          path: build-deb/*.deb

  windows:
    # Pin windows-2022 (VS 2022 / MSVC 14.4x). windows-latest now ships a much
    # newer toolset (VS 18 / MSVC 14.51) whose STL fully removed the legacy
    # stdext::checked_array_iterator that Qt 6.4.2's qvarlengtharray.h uses on
    # the MSVC path -- an unconditional use no compile flag can restore. VS 2022
    # still provides stdext, so the reference Qt 6.4 compiles there.
    runs-on: windows-2022
    # A GUI app that pops a modal dialog (e.g. a --version MessageBox, or a
    # missing-DLL error) would otherwise hang the runner until the 6h default.
    # Cap the whole job so any such hang fails fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.2"
          arch: win64_msvc2019_64

      # Qt for Windows is built for MSVC and injects MSVC-only flags
      # (/Zc:__cplusplus, /permissive-). With the Ninja generator CMake would
      # otherwise pick up the MinGW g++ on the runner's PATH and choke on those
      # flags, so activate the MSVC toolchain (puts cl.exe on PATH, exports the
      # env to later steps) before configuring. Constrain it to VS 2022 so a
      # newer side-by-side toolset can't be selected.
      #
      # Still on node20 and so still annotated as deprecated, unlike the actions/*
      # ones bumped to v7: v1.13.0 is its latest release and it is node20 too, so
      # there is no version to move to. Left alone deliberately — the runner forces
      # it onto node24 and it works; pinning a fork or vendoring the two lines of
      # vcvarsall it wraps would cost more than the warning does.
      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: "2022"

      # libarchive comes from vcpkg (preinstalled on this runner) rather than being
      # built from source like libssh2. The difference is codecs: libarchive is only
      # useful WITH zlib and liblzma, and it finds them through find_package in MODULE
      # mode, which a FetchContent-built copy cannot satisfy — libarchive then builds
      # with no compression at all and still reports itself found, so a .gz fails only
      # at runtime. A package manager supplies the codecs as a matter of course.
      # The static-md triplet keeps the portable zip free of extra DLLs, which is the
      # same reason libssh2 is static here.
      - name: Install libarchive (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "libarchive[core,bzip2,lzma,zstd]:x64-windows-static-md"

      - name: Configure + build and test
        shell: pwsh
        run: |
          # This runner has no package manager, so libssh2 is built from source
          # (-DLOFTAIL_SSH_FETCH=ON) — statically, against Windows' own CNG crypto.
          # That means no OpenSSL anywhere and nothing new for windeployqt or the
          # portable zip to carry, so the missing-DLL trap the smoke test below
          # guards against stays satisfied. Off by default so ordinary and offline
          # builds do no configure-time network access.
          #
          # libarchive comes from the vcpkg toolchain installed above;
          # LOFTAIL_ARCHIVE_STATIC tells our own sources that its API is not dllimport.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DLOFTAIL_ARCHIVE_STATIC=ON `
            -DLOFTAIL_SSH_FETCH=ON 2>&1 | Tee-Object configure.log
          # Neither is optional on this job — libssh2 is built from source and
          # libarchive was just installed — so "not found" means the setup broke, and a
          # silent DISABLED would shrink the suite and still go green.
          if (-not (Select-String -Path configure.log -Pattern "SSH remote sources: ENABLED" -Quiet)) {
            Write-Host "::error::libssh2 was not built; remote log support is off"; exit 1
          }
          if (-not (Select-String -Path configure.log -Pattern "Archived log sources: ENABLED" -Quiet)) {
            Write-Host "::error::libarchive was not built; archived log support is off"; exit 1
          }
          cmake --build build
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build --output-on-failure
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # A test that CRASHES loses its buffered stdout, so ctest reports the
            # failure with an empty output block and there is nothing to read --
            # which is exactly the state tst_logview has been failing in. Exit codes
            # survive a crash, so re-run each failed binary one test function at a
            # time and print the per-function status: the crashing function is the
            # one that does not come back 0.
            Write-Host "::group::Per-function exit codes for the failed test binaries"
            $listing = ctest --test-dir build --rerun-failed -N
            $failed = [regex]::Matches(($listing -join "`n"), 'Test\s+#\d+:\s+(\S+)') |
                        ForEach-Object { $_.Groups[1].Value }
            foreach ($t in $failed) {
              # Not build\tests\: on Windows Qt's finalizer puts executables in the
              # build root so they sit beside the Qt DLLs, unlike the Linux layout.
              # Search rather than assume either.
              $exe = (Get-ChildItem -Path build -Recurse -File -Filter "$t.exe" |
                        Select-Object -First 1).FullName
              if (-not $exe) { Write-Host "$t : binary not found under build\, skipped"; continue }
              foreach ($line in (& $exe -functions)) {
                $fn = $line.Trim().TrimEnd('()')
                if (-not $fn) { continue }
                & $exe $fn *> $null
                $status = if ($LASTEXITCODE -eq 0) { "ok" } else { "EXIT $LASTEXITCODE" }
                Write-Host ("{0}::{1} -> {2}" -f $t, $fn, $status)
                if ($LASTEXITCODE -ne 0) {
                  # Whatever the test prints is not reaching ctest on Windows, so
                  # ask QtTest for a FILE and read that back: it names the assertion
                  # and the line, which is the thing actually worth having.
                  $report = "qtest-$t-$fn.txt"
                  & $exe $fn -o "$report,txt" *> $null
                  if (Test-Path $report) { Get-Content $report | ForEach-Object { Write-Host "    $_" } }
                }
              }
            }
            Write-Host "::endgroup::"
          }
          exit $code

      # The SAME optional-dependency flags as the tested build above. This script
      # configures a build tree of its own, so without them the zip would ship a
      # loftail that cannot open a remote or a compressed log while every test in this
      # run passed — the artifact and the tested build would not be the same build.
      # That is exactly what happened before this was passed through.
      - name: Build portable zip
        shell: pwsh
        run: |
          # Invoked in this pwsh session rather than via `powershell -File`, which
          # parses its arguments as literal strings and would collapse the array below
          # into one nonsense flag.
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & packaging\windows\build-portable.ps1 -CMakeArgs @(
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake",
              "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md",
              "-DLOFTAIL_ARCHIVE_STATIC=ON",
              "-DLOFTAIL_SSH_FETCH=ON"
          )
          # Assert on the PACKAGED build, not just the tested one: a DISABLED here
          # means the shipped zip is missing a feature the whole run just proved works.
          $log = Get-Content configure-portable.log -Raw
          foreach ($want in @("SSH remote sources: ENABLED", "Archived log sources: ENABLED")) {
            if ($log -notmatch [regex]::Escape($want)) {
              Write-Host "::error::the portable zip was built without '$want'"; exit 1
            }
          }

      - name: Smoke-test the portable build (uses bundled Qt only)
        shell: pwsh
        run: |
          # Run with a hard timeout and capture output, so a regression that pops
          # a modal dialog (the GUI-subsystem --version MessageBox trap) fails the
          # step in seconds instead of blocking until the job timeout.
          $exe = "dist\loftail-portable\loftail.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          if (-not $p.WaitForExit(30000)) {
            $p.Kill()
            Write-Error "loftail.exe --version did not exit within 30s (modal dialog / hang)"
            exit 1
          }
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) {
            Write-Error "loftail.exe --version exited with code $($p.ExitCode)"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: loftail-windows-portable
          path: dist/*.zip

  macos:
    # Temporarily disabled. Flip `if` back to true (or delete this line) to
    # re-enable the macOS build+package job.
    if: false
    # Qt 6.4.2's macOS package hard-links the legacy AGL framework, which newer
    # macOS SDKs removed ("framework 'AGL' not found"). Use the Intel macos-13
    # runner and pin Xcode 14.3.1 (macOS 13.3 SDK), which still ships AGL, so
    # the reference Qt 6.4 links.
    #
    # If re-enabled: `brew install libssh2` gives remote log support here too, and
    # macdeployqt will need the same bundling check the AppImage step does.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 14.3.1 (SDK that still ships AGL)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "14.3.1"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.2"
          arch: clang_64

      - name: Configure + build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Build .app bundle + dmg
        run: packaging/macos/build-appbundle.sh Release

      - name: Smoke-test the bundle
        run: |
          ./build-macos/src/loftail.app/Contents/MacOS/loftail --version

      - uses: actions/upload-artifact@v7
        with:
          name: loftail-macos-dmg
          path: dist/*.dmg
