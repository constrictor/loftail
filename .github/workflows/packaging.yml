name: build-test-package

# Builds, tests, and packages loftail on all three target platforms.
#
# This workflow is the vehicle for the cross-platform verification that cannot
# happen on the Linux dev machine: it produces the Windows and macOS artifacts
# and smoke-tests them, and doubles as the "verify the build on Windows and
# macOS" check that PLAN.md M0 left open.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Ubuntu 24.04 is the reference build environment (ARCHITECTURE.md §1):
    # stock GCC 13 + CMake + Ninja + Qt 6.4.2 from the system repos, no
    # separately-installed Qt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + system Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            qt6-base-dev libgl1-mesa-dev \
            libssh2-1-dev \
            libfuse2 file desktop-file-utils

      - name: Configure + build (Debug) and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee configure.log
          # SSH support is AUTO-detected, so a missing libssh2 would quietly disable
          # remote logs and the job would still go green. It is installed above, so
          # "not found" here means the dependency broke — fail loudly.
          grep -q "SSH remote sources: ENABLED" configure.log \
            || { echo "::error::libssh2 was not detected; remote log support is off"; exit 1; }
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      # The no-SSH configuration is a supported build, not a theoretical one
      # (ARCHITECTURE.md §1: the reference build installs nothing extra). Prove it
      # still builds and that its whole test suite passes.
      - name: Configure + build + test without SSH
        run: |
          cmake -S . -B build-nossh -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOFTAIL_WITH_SSH=OFF
          cmake --build build-nossh
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-nossh --output-on-failure

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh Release

      - name: Smoke-test the AppImage (no dev Qt env)
        env:
          # CI runners are headless (no X display); the AppImage bundles the
          # offscreen QPA plugin so QApplication can start without one.
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMG=$(ls dist/loftail-*-x86_64.AppImage | head -n1)
          chmod +x "$APPIMG"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMG" --version
          # linuxdeploy resolves dependencies through ldd, so libssh2 (and the crypto
          # it pulls in) should have been bundled. Verify rather than assume: a
          # --version smoke test does not open a remote log, so a missing library
          # would only surface for a user, on the first ssh:// open.
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMG" --appimage-extract >/dev/null
          if ! ls squashfs-root/usr/lib/libssh2.so* >/dev/null 2>&1; then
            echo "::error::libssh2 was not bundled into the AppImage"
            exit 1
          fi
          ls -l squashfs-root/usr/lib/libssh2.so*
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: loftail-linux-appimage
          path: dist/*.AppImage

  windows:
    # Pin windows-2022 (VS 2022 / MSVC 14.4x). windows-latest now ships a much
    # newer toolset (VS 18 / MSVC 14.51) whose STL fully removed the legacy
    # stdext::checked_array_iterator that Qt 6.4.2's qvarlengtharray.h uses on
    # the MSVC path -- an unconditional use no compile flag can restore. VS 2022
    # still provides stdext, so the reference Qt 6.4 compiles there.
    runs-on: windows-2022
    # A GUI app that pops a modal dialog (e.g. a --version MessageBox, or a
    # missing-DLL error) would otherwise hang the runner until the 6h default.
    # Cap the whole job so any such hang fails fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.2"
          arch: win64_msvc2019_64

      # Qt for Windows is built for MSVC and injects MSVC-only flags
      # (/Zc:__cplusplus, /permissive-). With the Ninja generator CMake would
      # otherwise pick up the MinGW g++ on the runner's PATH and choke on those
      # flags, so activate the MSVC toolchain (puts cl.exe on PATH, exports the
      # env to later steps) before configuring. Constrain it to VS 2022 so a
      # newer side-by-side toolset can't be selected.
      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: "2022"

      - name: Configure + build and test
        shell: pwsh
        run: |
          # This runner has no package manager, so libssh2 is built from source
          # (-DLOFTAIL_SSH_FETCH=ON) — statically, against Windows' own CNG crypto.
          # That means no OpenSSL anywhere and nothing new for windeployqt or the
          # portable zip to carry, so the missing-DLL trap the smoke test below
          # guards against stays satisfied. Off by default so ordinary and offline
          # builds do no configure-time network access.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOFTAIL_SSH_FETCH=ON
          cmake --build build
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build --output-on-failure
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # A test that CRASHES loses its buffered stdout, so ctest reports the
            # failure with an empty output block and there is nothing to read --
            # which is exactly the state tst_logview has been failing in. Exit codes
            # survive a crash, so re-run each failed binary one test function at a
            # time and print the per-function status: the crashing function is the
            # one that does not come back 0.
            Write-Host "::group::Per-function exit codes for the failed test binaries"
            $listing = ctest --test-dir build --rerun-failed -N
            $failed = [regex]::Matches(($listing -join "`n"), 'Test\s+#\d+:\s+(\S+)') |
                        ForEach-Object { $_.Groups[1].Value }
            foreach ($t in $failed) {
              # Not build\tests\: on Windows Qt's finalizer puts executables in the
              # build root so they sit beside the Qt DLLs, unlike the Linux layout.
              # Search rather than assume either.
              $exe = (Get-ChildItem -Path build -Recurse -File -Filter "$t.exe" |
                        Select-Object -First 1).FullName
              if (-not $exe) { Write-Host "$t : binary not found under build\, skipped"; continue }
              foreach ($line in (& $exe -functions)) {
                $fn = $line.Trim().TrimEnd('()')
                if (-not $fn) { continue }
                & $exe $fn *> $null
                $status = if ($LASTEXITCODE -eq 0) { "ok" } else { "EXIT $LASTEXITCODE" }
                Write-Host ("{0}::{1} -> {2}" -f $t, $fn, $status)
                if ($LASTEXITCODE -ne 0) {
                  # Whatever the test prints is not reaching ctest on Windows, so
                  # ask QtTest for a FILE and read that back: it names the assertion
                  # and the line, which is the thing actually worth having.
                  $report = "qtest-$t-$fn.txt"
                  & $exe $fn -o "$report,txt" *> $null
                  if (Test-Path $report) { Get-Content $report | ForEach-Object { Write-Host "    $_" } }
                }
              }
            }
            Write-Host "::endgroup::"
          }
          exit $code

      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-portable.ps1

      - name: Smoke-test the portable build (uses bundled Qt only)
        shell: pwsh
        run: |
          # Run with a hard timeout and capture output, so a regression that pops
          # a modal dialog (the GUI-subsystem --version MessageBox trap) fails the
          # step in seconds instead of blocking until the job timeout.
          $exe = "dist\loftail-portable\loftail.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          if (-not $p.WaitForExit(30000)) {
            $p.Kill()
            Write-Error "loftail.exe --version did not exit within 30s (modal dialog / hang)"
            exit 1
          }
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) {
            Write-Error "loftail.exe --version exited with code $($p.ExitCode)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: loftail-windows-portable
          path: dist/*.zip

  macos:
    # Temporarily disabled. Flip `if` back to true (or delete this line) to
    # re-enable the macOS build+package job.
    if: false
    # Qt 6.4.2's macOS package hard-links the legacy AGL framework, which newer
    # macOS SDKs removed ("framework 'AGL' not found"). Use the Intel macos-13
    # runner and pin Xcode 14.3.1 (macOS 13.3 SDK), which still ships AGL, so
    # the reference Qt 6.4 links.
    #
    # If re-enabled: `brew install libssh2` gives remote log support here too, and
    # macdeployqt will need the same bundling check the AppImage step does.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 14.3.1 (SDK that still ships AGL)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "14.3.1"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.2"
          arch: clang_64

      - name: Configure + build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Build .app bundle + dmg
        run: packaging/macos/build-appbundle.sh Release

      - name: Smoke-test the bundle
        run: |
          ./build-macos/src/loftail.app/Contents/MacOS/loftail --version

      - uses: actions/upload-artifact@v4
        with:
          name: loftail-macos-dmg
          path: dist/*.dmg
