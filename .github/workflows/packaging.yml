name: build-test-package

# Builds, tests, and packages loftail on all three target platforms.
#
# This workflow is the vehicle for the cross-platform verification that cannot
# happen on the Linux dev machine: it produces the Windows and macOS artifacts
# and smoke-tests them, and doubles as the "verify the build on Windows and
# macOS" check that PLAN.md M0 left open.

# No tag trigger. A tag is applied to a commit that has ALREADY been built and tested
# here, by release.yml promoting that run — so building again on the tag would rebuild
# the same commit to produce artifacts nothing publishes, and would invite the belief
# that a tag build is what ships. Releasing is not building; see release.yml.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Stamped into --version by every configure in every job below, which reads these two
# from the environment (top-level CMakeLists.txt, "Build identity"). Set here rather
# than on each cmake command line because two of the four packaged builds configure
# inside a packaging script whose command line no caller can reach — and because a
# per-job flag is exactly the kind of thing a new job forgets, which would ship one
# unidentifiable artifact among four identified ones.
#
# It does NOT touch the version in the artifacts' FILENAMES: those name the release,
# and the .deb job asserts on the shape of that name.
env:
  LOFTAIL_BUILD_NUMBER: ${{ github.run_number }}
  LOFTAIL_BUILD_COMMIT: ${{ github.sha }}

jobs:
  linux:
    # Ubuntu 24.04 is the reference build environment (ARCHITECTURE.md §1):
    # stock GCC 13 + CMake + Ninja + Qt 6.4.2 from the system repos, no
    # separately-installed Qt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain + system Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            qt6-base-dev libgl1-mesa-dev \
            libssh2-1-dev libarchive-dev qtkeychain-qt6-dev \
            libfuse2 file desktop-file-utils

      - name: Configure + build (Debug) and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee configure.log
          # SSH support is AUTO-detected, so a missing libssh2 would quietly disable
          # remote logs and the job would still go green. It is installed above, so
          # "not found" here means the dependency broke — fail loudly.
          grep -q "SSH remote sources: ENABLED" configure.log \
            || { echo "::error::libssh2 was not detected; remote log support is off"; exit 1; }
          # Same for libarchive: auto-detection failing silently would drop the archive
          # tests from the run entirely, so the suite would shrink and still go green.
          grep -q "Archived log sources: ENABLED" configure.log \
            || { echo "::error::libarchive was not detected; archived log support is off"; exit 1; }
          # And for QtKeychain, where the silent failure is the worst of the three: it
          # would not shrink the suite or drop a feature, it would change WHERE a
          # remembered password is written — from the OS keychain to a plain-text file.
          grep -q "OS keychain for passwords: ENABLED" configure.log \
            || { echo "::error::QtKeychain was not detected; remembered passwords fall back to plain text"; exit 1; }
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      # The no-SSH configuration is a supported build, not a theoretical one
      # (ARCHITECTURE.md §1: the reference build installs nothing extra). Prove it
      # still builds and that its whole test suite passes.
      - name: Configure + build + test without SSH
        run: |
          cmake -S . -B build-nossh -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOFTAIL_WITH_SSH=OFF
          cmake --build build-nossh
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-nossh --output-on-failure

      # Likewise for archives, and both off together — which is the actual reference
      # build (ARCHITECTURE.md §1: stock Ubuntu toolchain, nothing separately
      # installed). The ungated tests must pass here too: tst_archivelocation and
      # tst_complete cover the path layer and the completion contract precisely
      # because those must behave the same with and without the dependency.
      - name: Configure + build + test with neither optional dependency
        run: |
          cmake -S . -B build-bare -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DLOFTAIL_WITH_SSH=OFF -DLOFTAIL_WITH_ARCHIVE=OFF -DLOFTAIL_WITH_KEYCHAIN=OFF \
            2>&1 | tee configure-bare.log
          grep -q "Archived log sources: DISABLED" configure-bare.log \
            || { echo "::error::-DLOFTAIL_WITH_ARCHIVE=OFF did not disable archives"; exit 1; }
          grep -q "OS keychain for passwords: DISABLED" configure-bare.log \
            || { echo "::error::-DLOFTAIL_WITH_KEYCHAIN=OFF did not disable the keychain"; exit 1; }
          cmake --build build-bare
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-bare --output-on-failure

      # SSH built, keychain not. The one configuration where the plain-text fallback is
      # the ONLY place a remembered password can go — and the one most users on a server
      # or a minimal desktop actually get. build-bare above does not cover it: with SSH
      # off it never reaches the credential code at all.
      - name: Configure + build + test with SSH but no keychain
        run: |
          cmake -S . -B build-nokeychain -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DLOFTAIL_WITH_KEYCHAIN=OFF 2>&1 | tee configure-nokeychain.log
          grep -q "SSH remote sources: ENABLED" configure-nokeychain.log \
            || { echo "::error::this leg is meaningless without SSH; libssh2 was not detected"; exit 1; }
          grep -q "OS keychain for passwords: DISABLED" configure-nokeychain.log \
            || { echo "::error::-DLOFTAIL_WITH_KEYCHAIN=OFF did not disable the keychain"; exit 1; }
          cmake --build build-nokeychain
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-nokeychain --output-on-failure

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh Release

      - name: Smoke-test the AppImage (no dev Qt env)
        env:
          # CI runners are headless (no X display); the AppImage bundles the
          # offscreen QPA plugin so QApplication can start without one.
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMG=$(ls dist/loftail-*-x86_64.AppImage | head -n1)
          chmod +x "$APPIMG"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMG" --version
          # linuxdeploy resolves dependencies through ldd, so libssh2 (and the crypto
          # it pulls in) should have been bundled. Verify rather than assume: a
          # --version smoke test does not open a remote log, so a missing library
          # would only surface for a user, on the first ssh:// open.
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMG" --appimage-extract >/dev/null
          #
          # libqt6keychain is genuinely linked, so ldd finds it. libsecret DELIBERATELY
          # is not listed: QtKeychain dlopen()s it (its libsecret.cpp constructs a
          # QLibrary("secret-1")), so ldd cannot see it and linuxdeploy will not bundle
          # it. The consequence is real and documented rather than discovered — inside
          # the AppImage, on a host with no libsecret-1.so.0, available() is false and
          # loftail falls back to plain text and says so in the dialog.
          for lib in libssh2 libarchive libqt6keychain; do
            if ! ls squashfs-root/usr/lib/$lib.so* >/dev/null 2>&1; then
              echo "::error::$lib was not bundled into the AppImage"
              exit 1
            fi
          done
          ls -l squashfs-root/usr/lib/libssh2.so* squashfs-root/usr/lib/libarchive.so* \
                squashfs-root/usr/lib/libqt6keychain.so*
          rm -rf squashfs-root

      # As the .deb job: upload the AppImage itself, not a zip of it. Doubly pointless
      # here — an AppImage is a compressed squashfs, so the wrapper cost transfer time
      # and gained nothing.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.AppImage
          archive: false
          if-no-files-found: error

  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer + LeakSanitizer over the whole suite
    # (ARCHITECTURE.md §13).
    #
    # A job of its own rather than another step in `linux`: it is a separate build of
    # everything, it takes about four times as long to run as the plain suite, and when it
    # fails the useful signal is which sanitizer fired — which the other job's four
    # configurations would bury.
    #
    # ThreadSanitizer is deliberately NOT here. It is a supported build
    # (-DLOFTAIL_SANITIZE=thread, with tests/tsan.supp and the `threading` test label) and
    # it is run BY HAND, because its own thread registry aborts on Qt's detached QThreads
    # — measured on both GCC 15 and clang 21, killing 6 of the 17 threading tests before
    # they finish. ARCHITECTURE.md §13 has the detail. Gating on that would mean a red
    # pipeline that says nothing about loftail.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain + system Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            qt6-base-dev libgl1-mesa-dev \
            libssh2-1-dev libarchive-dev qtkeychain-qt6-dev

      - name: Configure + build with ASan/UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLOFTAIL_SANITIZE=address 2>&1 | tee configure-asan.log
          # The option is the whole point of the job; a typo that silently produced an
          # ordinary build would go green and prove nothing.
          grep -q "Sanitizer: address" configure-asan.log \
            || { echo "::error::-DLOFTAIL_SANITIZE=address did not take effect"; exit 1; }
          # The optional dependencies again, for the same reason as in the `linux` job:
          # auto-detection failing silently would shrink what is being sanitized.
          for want in "SSH remote sources: ENABLED" "Archived log sources: ENABLED" \
                      "OS keychain for passwords: ENABLED"; do
            grep -q "$want" configure-asan.log \
              || { echo "::error::the sanitizer build reported '$want' missing"; exit 1; }
          done
          cmake --build build-asan

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Leak detection stays ON, and nothing of loftail's is suppressed: the one
          # by-design retention, an abandoned fetcher whose thread is still running, is
          # parked in a reachable static rather than leaked, precisely so that this can
          # stay on (SourceSpool.cpp, drainRetired). tests/lsan.supp holds one third-party
          # entry, libproxy, and is meant to stay that short. That is only cheap to keep
          # true if it never goes red.
          #
          # detect_stack_use_after_return catches the exact class the M17 call-gate bug
          # was: a lambda still reading a frame whose owner has returned. It is the reason
          # this job exists, so it is switched on rather than left at its default.
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          # Leak suppressions are LSan's, not ASan's, even when LSan is running inside
          # ASan. print_suppressions reports which ones actually matched, so the file is
          # checkable rather than a list of guesses that quietly stops applying.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure

  clang-tidy:
    # Static analysis over src/ (.clang-tidy at the repo root holds the check list
    # and the reasoning behind every exclusion).
    #
    # A job of its own for the reason the sanitizer job above gives: it is a separate
    # build of everything with a different compiler, and when it has something to say
    # the useful signal is which check fired — which the `linux` job's four
    # configurations would bury.
    #
    # It COMPLEMENTS the sanitizers rather than overlapping them. ASan and TSan are
    # runtime tools and see only what a test actually drives; ARCHITECTURE.md §13
    # records that neither found the M17 call-gate bug for exactly that reason.
    # clang-tidy reads every translation unit whether or not a test reaches it, which
    # is what makes it worth having in a tree where whole files (the libssh2
    # transport, the Windows-only paths, PresetPane.cpp) are documented as never
    # exercised by CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # NON-BLOCKING, on purpose and for now. The tree had never been linted when this
    # landed: the first sweep reported 805 lines / 408 distinct findings over src/,
    # none of them fixed in the same change, so a job that gated would be red from
    # the day it arrived — and a check that is always red is a check people learn to
    # scroll past. Tighten to blocking (drop this line, add WarningsAsErrors to
    # .clang-tidy) once that baseline is at zero.
    #
    # It goes on the JOB, not on a step. At job level the WORKFLOW's own conclusion
    # stays `success`, which is what release.yml's promote guard tests when it
    # refuses to publish anything but a green run. On a step the job itself would go
    # red and take the workflow's conclusion with it, quietly breaking releases.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain + system Qt 6 + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            qt6-base-dev libgl1-mesa-dev \
            libssh2-1-dev libarchive-dev qtkeychain-qt6-dev \
            clang-18 clang-tidy-18

      - name: Configure
        run: |
          # clang++, NOT the runner's GCC. compile_commands.json is what clang-tidy
          # consumes, and a database written by GCC carries flags and libstdc++
          # header expectations clang can reject outright — a whole-file parse error
          # reported as a finding. One toolchain writes it and reads it.
          #
          # The version is pinned on both halves: 24.04's clang-tidy is 18 and a dev
          # machine may have anything (21 here). A finding present under one and
          # absent under the other is expected, so at least make CI's answer stable.
          cmake -S . -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLOFTAIL_CLANG_TIDY_EXE=clang-tidy-18 2>&1 | tee configure-tidy.log
          # The optional dependencies again, for the same reason as in every other
          # job: auto-detection failing silently would shrink what is analysed, and a
          # sweep that skipped the SSH and archive layers would report clean about
          # code it never read.
          for want in "SSH remote sources: ENABLED" "Archived log sources: ENABLED" \
                      "OS keychain for passwords: ENABLED"; do
            grep -q "$want" configure-tidy.log \
              || { echo "::error::the clang-tidy build reported '$want' missing"; exit 1; }
          done
          test -s build-tidy/compile_commands.json \
            || { echo "::error::no compile_commands.json; CMAKE_EXPORT_COMPILE_COMMANDS is off"; exit 1; }
          # run-clang-tidy ships with the clang-tidy package, so a miss here means the
          # install step changed. Worth its own assertion because the target simply
          # would not EXIST, and `--target clang_tidy` would fail as "no rule to make
          # target" — which, in a job that does not gate, reads as nothing at all.
          if grep -q "clang-tidy sweep targets: unavailable" configure-tidy.log; then
            echo "::error::run-clang-tidy was not found; the clang_tidy target does not exist"
            exit 1
          fi

      - name: Generate Qt sources
        # AUTOMOC/AUTOUIC outputs are #included BY the real sources, so they have to
        # exist before clang-tidy parses them — otherwise every file with a Q_OBJECT
        # fails to parse and the sweep reports errors instead of findings.
        #
        # `--target loftail` and not the default target: that builds core, ui and the
        # app, and skips the 79 test binaries, which this job does not analyse
        # (`clang_tidy_all` is the target for those). It is most of the job's budget.
        run: cmake --build build-tidy --target loftail

      - name: Run clang-tidy over src/
        run: |
          # The standalone route: run-clang-tidy over the database the step above
          # wrote. The path regex is what keeps _deps/ and the *_autogen TUs out.
          #
          # The pipe into tee is load-bearing, not just for the artifact:
          # run-clang-tidy exits NON-ZERO when it has findings, and GitHub runs each
          # `run:` under `bash -e` without pipefail — so the pipeline's status is
          # tee's, and the tally below still gets written. Add `set -o pipefail` here
          # and every run with a finding skips its own summary.
          cmake --build build-tidy --target clang_tidy 2>&1 | tee clang-tidy.log

          # A tally rather than the log itself, because the log is thousands of lines
          # and the thing worth seeing at a glance is which checks are talking.
          {
            echo "### clang-tidy over \`src/\` (clang-tidy 18)"
            echo
            total=$(grep -cE 'warning: ' clang-tidy.log || true)
            distinct=$(grep -E 'warning: ' clang-tidy.log | sort -u | wc -l)
            echo "$total reported lines, $distinct distinct findings."
            echo "A header is re-reported once per translation unit that includes it."
            echo
            echo '| count | check |'
            echo '| ----: | ----- |'
            grep -oE '\[[a-z][a-zA-Z0-9.-]*(,[a-z][a-zA-Z0-9.-]*)*\]$' clang-tidy.log \
              | tr -d '[]' | tr ',' '\n' | sort | uniq -c | sort -rn \
              | awk '{ printf "| %s | `%s` |\n", $1, $2 }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the findings
        # Always, not only on failure: the job does not fail (continue-on-error), so
        # the artifact is the only place the findings themselves survive.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          if-no-files-found: error

  deb:
    # Ubuntu packages, one per release. NOT one package built once: 24.04 has
    # Qt 6.4.2 and 26.04 a much newer Qt with different sonames, so a single .deb
    # cannot satisfy both. The release is stamped into the version
    # (0.1.0~ubuntu24.04) by packaging/linux/deb.cmake, from /etc/os-release.
    #
    # This is the opposite artifact to the AppImage above and deliberately
    # duplicates its build: the AppImage bundles Qt so it runs anywhere, the .deb
    # links the distro's Qt so it stays small and gets archive security updates.
    # The AppImage step asserts the optional libraries are INSIDE the artifact;
    # here the same guarantee is an assertion that they are in Depends.
    #
    # 26.04 is a second thing at once: the reference Qt floor is 6.4 (ARCHITECTURE.md
    # §1) and nothing so far proves the CEILING — this is the only job that compiles
    # loftail with a much newer Qt and GCC.
    strategy:
      # Not fail-fast: a break on one release must not cancel the other's package.
      # They fail for different reasons — 24.04 for the Qt floor, 26.04 for the
      # ceiling — and each leg's answer is worth having even when the other is red.
      fail-fast: false
      matrix:
        # ubuntu-26.04 is a PUBLIC PREVIEW runner image (announced 2026-06-11) and
        # was non-blocking to begin with. It is a required check now: it has run
        # green with no preview-side trouble, and it is the only job in the workflow
        # that compiles against a Qt newer than the 6.4 floor, so letting it fail
        # quietly would mean the ceiling is untested exactly when it breaks.
        # To make a future preview release non-blocking, give this job
        # `continue-on-error` on a matrix flag rather than reaching for `if:`.
        release: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.release }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain + system Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            qt6-base-dev libgl1-mesa-dev \
            libssh2-1-dev libarchive-dev qtkeychain-qt6-dev \
            file desktop-file-utils

      - name: Configure + build (Release) and test
        run: |
          cmake -S . -B build-deb -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure-deb.log
          # Both are auto-detected and both were just installed, so DISABLED here means
          # the setup broke — and it would go on to produce a package that silently
          # lacks the feature, since shlibdeps only reports what was actually linked.
          for want in "SSH remote sources: ENABLED" "Archived log sources: ENABLED" \
                      "OS keychain for passwords: ENABLED"; do
            grep -q "$want" configure-deb.log \
              || { echo "::error::the packaged build reported '$want' missing"; exit 1; }
          done
          cmake --build build-deb
          # Run the suite against THIS toolchain, not just the Debug job's. On 26.04
          # that is the point of the job as much as the package is.
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-deb --output-on-failure

      - name: Build .deb
        working-directory: build-deb
        run: cpack -G DEB

      - name: Verify the package metadata
        run: |
          DEB=$(ls build-deb/loftail_*.deb | head -n1)
          echo "package: $DEB"
          dpkg -I "$DEB"
          dpkg -c "$DEB"

          # The version must name the release it was built for, or the two releases'
          # packages collide on a release page and upgrade over each other.
          case "$DEB" in
            *"~ubuntu${{ matrix.release }}_"*) ;;
            *) echo "::error::$DEB is not stamped ~ubuntu${{ matrix.release }}"; exit 1 ;;
          esac

          # A .deb bundles nothing, so "the optional libraries are present" means they
          # are in Depends. dpkg-shlibdeps writes a thin, valid-looking Depends just as
          # happily when a library was auto-detected off.
          DEPENDS=$(dpkg -f "$DEB" Depends)
          #
          # libqt6keychain is in this list and libsecret is NOT, for the same reason the
          # AppImage bundles one and not the other: QtKeychain links the first and
          # dlopen()s the second, and shlibdeps only sees what was linked. libsecret is
          # a Recommends instead — see packaging/linux/deb.cmake.
          for lib in libqt6 libssh2 libarchive libqt6keychain; do
            echo "$DEPENDS" | grep -q "$lib" \
              || { echo "::error::Depends does not mention $lib: $DEPENDS"; exit 1; }
          done

          # And nothing of Qt may be INSIDE it — that is the AppImage's job. A stray
          # bundled libQt6*.so would ship an unmanaged, unpatched Qt to users.
          if dpkg -c "$DEB" | grep -q "libQt6"; then
            echo "::error::the .deb bundles Qt libraries; it must link the distro's"
            exit 1
          fi

      - name: Install it and run it
        run: |
          DEB=$(ls build-deb/loftail_*.deb | head -n1)
          # apt, not dpkg -i: it RESOLVES Depends, so a dependency that does not exist
          # in this release's archive fails here rather than on a user's machine.
          sudo apt-get install -y "./$DEB"
          command -v loftail
          QT_QPA_PLATFORM=offscreen loftail --version
          # The .desktop file is what makes the soft file association work once
          # installed (packaging/README.md); a malformed one installs silently.
          desktop-file-validate /usr/share/applications/loftail.desktop
          sudo apt-get remove -y loftail

      # archive: false uploads the .deb ITSELF rather than a zip containing it —
      # the artifact API zipped everything until upload-artifact v7 added this, so a
      # 450 KB package arrived as a zip you had to unpack to get a package. It takes
      # a single file only and names the artifact after it, ignoring `name:`, which
      # is why the version carries the release: loftail_0.1.0~ubuntu24.04_amd64.deb
      # and its 26.04 twin are distinct names within the run without help.
      # if-no-files-found: error because the default only WARNS — a glob that stops
      # matching would otherwise pass a green job with nothing attached to it.
      - uses: actions/upload-artifact@v7
        with:
          path: build-deb/*.deb
          archive: false
          if-no-files-found: error

  windows:
    # Pin windows-2022 (VS 2022 / MSVC 14.4x). windows-latest now ships a much
    # newer toolset (VS 18 / MSVC 14.51) whose STL fully removed the legacy
    # stdext::checked_array_iterator that Qt 6.4.2's qvarlengtharray.h uses on
    # the MSVC path -- an unconditional use no compile flag can restore. VS 2022
    # still provides stdext, so the reference Qt 6.4 compiles there.
    runs-on: windows-2022
    # A GUI app that pops a modal dialog (e.g. a --version MessageBox, or a
    # missing-DLL error) would otherwise hang the runner until the 6h default.
    # Cap the whole job so any such hang fails fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.2"
          arch: win64_msvc2019_64

      # Qt for Windows is built for MSVC and injects MSVC-only flags
      # (/Zc:__cplusplus, /permissive-). With the Ninja generator CMake would
      # otherwise pick up the MinGW g++ on the runner's PATH and choke on those
      # flags, so activate the MSVC toolchain (puts cl.exe on PATH, exports the
      # env to later steps) before configuring. Constrain it to VS 2022 so a
      # newer side-by-side toolset can't be selected.
      #
      # This was ilammy/msvc-dev-cmd@v1, which is node20 and so annotated as
      # deprecated on every run. Unlike the actions/* ones bumped to v7 there was no
      # version to move to: v1.13.0 (Jan 2024) is its latest release and is node20
      # too, and the repository has not been pushed to since Apr 2024. What the
      # action does is find vcvarsall.bat and export what it changes, so it is done
      # here directly rather than swapping in another third-party action that will
      # eventually deprecate the same way — this step now has no node runtime to age.
      - name: Set up MSVC toolchain
        shell: pwsh
        run: |
          # vswhere ships with the VS Installer and is the supported way to locate an
          # installation. The version range is the "vsversion: 2022" constraint:
          # VS 2022 is toolset 17.x, so [17.0,18.0) excludes a side-by-side 2026.
          # -requires rejects an installation that has no x64 C++ compiler at all,
          # which is what makes a wrong pick fail here rather than at the first cl.exe.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "::error::vswhere.exe not found; no Visual Studio installer on this runner"
            exit 1
          }
          $install = (& $vswhere -products '*' -version '[17.0,18.0)' `
                        -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                        -property installationPath -latest | Select-Object -First 1)
          if (-not $install) {
            Write-Host "::error::no VS 2022 installation with the x64 C++ toolset"
            exit 1
          }
          $vcvars = Join-Path $install.Trim() 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) {
            Write-Host "::error::found VS 2022 at $install but no vcvarsall.bat under it"
            exit 1
          }

          # vcvarsall is invoked from a generated .cmd rather than by handing a quoted
          # command string to `cmd /c`. PowerShell escapes an embedded double quote as
          # \" when it builds a native command line and cmd.exe has no such escape, so
          # `cmd /c "`"$vcvars`" x64 && set"` -- the idiom this would otherwise be --
          # mangles exactly the paths that need quoting, and vcvarsall.bat is always
          # under "Program Files (x86)". Inside a .cmd file cmd does its own quoting.
          $runner = Join-Path $env:RUNNER_TEMP 'loftail-vcvars.cmd'
          $log = Join-Path $env:RUNNER_TEMP 'loftail-vcvars.log'
          @(
            '@echo off'
            # vcvarsall reports failure on stdout, not stderr, so keep the output for
            # the error path instead of sending it to nul.
            "call `"$vcvars`" x64 > `"$log`" 2>&1 || exit /b 1"
            'set'
          ) | Set-Content -LiteralPath $runner -Encoding ascii

          # Export the environment DELTA across vcvarsall, not everything `set` prints:
          # the latter would write the runner's own GITHUB_*/RUNNER_* variables back
          # into GITHUB_ENV. Both sides are read through cmd so the two listings are in
          # the same format and the difference is only vcvarsall's doing.
          function Read-CmdEnv($lines) {
            $table = @{}
            foreach ($line in $lines) {
              $name, $value = $line -split '=', 2
              # cmd emits pseudo-variables whose name is empty ("=C:", "=ExitCode");
              # they split to an empty name and are dropped here.
              if ($name) { $table[$name] = $value }
            }
            return $table
          }
          $before = Read-CmdEnv (cmd /c set)
          $afterLines = cmd /c $runner
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::vcvarsall.bat x64 failed with exit code $LASTEXITCODE"
            if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
            exit 1
          }
          $after = Read-CmdEnv $afterLines
          $changed = foreach ($name in $after.Keys) {
            if ($before[$name] -ne $after[$name]) { "$name=$($after[$name])" }
          }
          # A silent no-op would leave MinGW g++ first on PATH and fail much later, in
          # CMake's compiler probe, with nothing pointing back at this step. cmd's own
          # variables (PROMPT, COMSPEC) cancel out of the diff because the baseline is
          # read through cmd as well, so an empty delta really does mean nothing ran.
          if (-not $changed) {
            Write-Host "::error::vcvarsall.bat changed no environment variables"
            exit 1
          }
          # Appended in one write, and -Encoding utf8 is BOM-less under pwsh (7.x),
          # which is the shell here; Windows PowerShell 5.1 would emit a BOM and land
          # it in the middle of the file.
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $changed -Encoding utf8
          Write-Host "MSVC toolchain from $install ($($changed.Count) variables exported)"

      # libarchive comes from vcpkg (preinstalled on this runner) rather than being
      # built from source like libssh2. The difference is codecs: libarchive is only
      # useful WITH zlib and liblzma, and it finds them through find_package in MODULE
      # mode, which a FetchContent-built copy cannot satisfy — libarchive then builds
      # with no compression at all and still reports itself found, so a .gz fails only
      # at runtime. A package manager supplies the codecs as a matter of course.
      # The static-md triplet keeps the portable zip free of extra DLLs, which is the
      # same reason libssh2 is static here.
      - name: Install libarchive (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "libarchive[core,bzip2,lzma,zstd]:x64-windows-static-md"

      - name: Configure + build and test
        shell: pwsh
        run: |
          # This runner has no package manager, so libssh2 is built from source
          # (-DLOFTAIL_SSH_FETCH=ON) — statically, against Windows' own CNG crypto.
          # That means no OpenSSL anywhere and nothing new for windeployqt or the
          # portable zip to carry, so the missing-DLL trap the smoke test below
          # guards against stays satisfied. Off by default so ordinary and offline
          # builds do no configure-time network access.
          #
          # libarchive comes from the vcpkg toolchain installed above;
          # LOFTAIL_ARCHIVE_STATIC tells our own sources that its API is not dllimport.
          #
          # QtKeychain is built from source too, and DELIBERATELY NOT from vcpkg like
          # libarchive: vcpkg's qtkeychain-qt6 port depends on vcpkg's own qtbase and
          # qttools, so installing it would build Qt from source for hours and then sit
          # beside the install-qt-action Qt the rest of this job uses — two Qt6Cores, one
          # ABI. It is safe to build from source for the reason libarchive is not: on
          # Windows QtKeychain is a thin wrapper over the Credential Store with no
          # external dependency, so a source build is complete by construction. Static,
          # so the portable zip stays free of extra DLLs — advapi32 is all it needs.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DLOFTAIL_ARCHIVE_STATIC=ON `
            -DLOFTAIL_SSH_FETCH=ON `
            -DLOFTAIL_KEYCHAIN_FETCH=ON 2>&1 | Tee-Object configure.log
          # Neither is optional on this job — libssh2 is built from source and
          # libarchive was just installed — so "not found" means the setup broke, and a
          # silent DISABLED would shrink the suite and still go green.
          if (-not (Select-String -Path configure.log -Pattern "SSH remote sources: ENABLED" -Quiet)) {
            Write-Host "::error::libssh2 was not built; remote log support is off"; exit 1
          }
          if (-not (Select-String -Path configure.log -Pattern "Archived log sources: ENABLED" -Quiet)) {
            Write-Host "::error::libarchive was not built; archived log support is off"; exit 1
          }
          if (-not (Select-String -Path configure.log -Pattern "OS keychain for passwords: ENABLED" -Quiet)) {
            Write-Host "::error::QtKeychain was not built; remembered passwords fall back to plain text"; exit 1
          }
          cmake --build build
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build --output-on-failure
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # A test that CRASHES loses its buffered stdout, so ctest reports the
            # failure with an empty output block and there is nothing to read --
            # which is exactly the state tst_logview has been failing in. Exit codes
            # survive a crash, so re-run each failed binary one test function at a
            # time and print the per-function status: the crashing function is the
            # one that does not come back 0.
            Write-Host "::group::Per-function exit codes for the failed test binaries"
            $listing = ctest --test-dir build --rerun-failed -N
            $failed = [regex]::Matches(($listing -join "`n"), 'Test\s+#\d+:\s+(\S+)') |
                        ForEach-Object { $_.Groups[1].Value }
            foreach ($t in $failed) {
              # Not build\tests\: on Windows Qt's finalizer puts executables in the
              # build root so they sit beside the Qt DLLs, unlike the Linux layout.
              # Search rather than assume either.
              $exe = (Get-ChildItem -Path build -Recurse -File -Filter "$t.exe" |
                        Select-Object -First 1).FullName
              if (-not $exe) { Write-Host "$t : binary not found under build\, skipped"; continue }
              foreach ($line in (& $exe -functions)) {
                $fn = $line.Trim().TrimEnd('()')
                if (-not $fn) { continue }
                & $exe $fn *> $null
                $status = if ($LASTEXITCODE -eq 0) { "ok" } else { "EXIT $LASTEXITCODE" }
                Write-Host ("{0}::{1} -> {2}" -f $t, $fn, $status)
                if ($LASTEXITCODE -ne 0) {
                  # Whatever the test prints is not reaching ctest on Windows, so
                  # ask QtTest for a FILE and read that back: it names the assertion
                  # and the line, which is the thing actually worth having.
                  $report = "qtest-$t-$fn.txt"
                  & $exe $fn -o "$report,txt" *> $null
                  if (Test-Path $report) { Get-Content $report | ForEach-Object { Write-Host "    $_" } }
                }
              }
            }
            Write-Host "::endgroup::"
          }
          exit $code

      # The SAME optional-dependency flags as the tested build above. This script
      # configures a build tree of its own, so without them the zip would ship a
      # loftail that cannot open a remote or a compressed log while every test in this
      # run passed — the artifact and the tested build would not be the same build.
      # That is exactly what happened before this was passed through.
      - name: Build portable zip
        shell: pwsh
        run: |
          # Invoked in this pwsh session rather than via `powershell -File`, which
          # parses its arguments as literal strings and would collapse the array below
          # into one nonsense flag.
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & packaging\windows\build-portable.ps1 -CMakeArgs @(
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake",
              "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md",
              "-DLOFTAIL_ARCHIVE_STATIC=ON",
              "-DLOFTAIL_SSH_FETCH=ON",
              "-DLOFTAIL_KEYCHAIN_FETCH=ON"
          )
          # Assert on the PACKAGED build, not just the tested one: a DISABLED here
          # means the shipped zip is missing a feature the whole run just proved works.
          $log = Get-Content configure-portable.log -Raw
          foreach ($want in @("SSH remote sources: ENABLED", "Archived log sources: ENABLED",
                              "OS keychain for passwords: ENABLED")) {
            if ($log -notmatch [regex]::Escape($want)) {
              Write-Host "::error::the portable zip was built without '$want'"; exit 1
            }
          }

      - name: Smoke-test the portable build (uses bundled Qt only)
        shell: pwsh
        run: |
          # Run with a hard timeout and capture output, so a regression that pops
          # a modal dialog (the GUI-subsystem --version MessageBox trap) fails the
          # step in seconds instead of blocking until the job timeout.
          $exe = "dist\loftail-portable\loftail.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          if (-not $p.WaitForExit(30000)) {
            $p.Kill()
            Write-Error "loftail.exe --version did not exit within 30s (modal dialog / hang)"
            exit 1
          }
          Get-Content out.txt, err.txt
          if ($p.ExitCode -ne 0) {
            Write-Error "loftail.exe --version exited with code $($p.ExitCode)"
            exit 1
          }

      # This one was a zip INSIDE a zip: the portable build is already a zip, and the
      # artifact API wrapped it in another. archive: false uploads the real one.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

  macos:
    # Temporarily disabled. Flip `if` back to true (or delete this line) to
    # re-enable the macOS build+package job.
    if: false
    # Qt 6.4.2's macOS package hard-links the legacy AGL framework, which newer
    # macOS SDKs removed ("framework 'AGL' not found"). Use the Intel macos-13
    # runner and pin Xcode 14.3.1 (macOS 13.3 SDK), which still ships AGL, so
    # the reference Qt 6.4 links.
    #
    # If re-enabled: `brew install libssh2 qtkeychain` gives remote log support and the
    # OS keychain here too, and macdeployqt will need the same bundling check the
    # AppImage step does. macOS is the one platform where a keychain is unconditionally
    # there — Security.framework, no daemon and no session bus — so unlike the Linux
    # legs, a DISABLED there would only ever mean the package is missing.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 14.3.1 (SDK that still ships AGL)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "14.3.1"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.2"
          arch: clang_64

      - name: Configure + build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Build .app bundle + dmg
        run: packaging/macos/build-appbundle.sh Release

      - name: Smoke-test the bundle
        run: |
          ./build-macos/src/loftail.app/Contents/MacOS/loftail --version

      # Same as the other three, for whenever this job is re-enabled.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.dmg
          archive: false
          if-no-files-found: error
